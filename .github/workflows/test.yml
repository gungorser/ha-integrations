# Runs the unit tests (pytest-homeassistant-custom-component) on every pull request and on master.
name: tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install the test environment
        run: pip install -r requirements_test.txt
      - name: Run the tests
        run: pytest
